name: Generate Snake Animation
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: IstiakAhamedMubin
          outputs: |
            dist/github-snake.svg?color_snake=e2e8f0&color_dots=#1a1a2e,#16213e,#0f3460,#94a3b8,#e2e8f0
            dist/github-snake-dark.svg?palette=github-dark&color_snake=e2e8f0&color_dots=#1a1a2e,#16213e,#0f3460,#94a3b8,#e2e8f0
      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
