name: Generate Snake Animation
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: IstiakAhamedMubin
          outputs: |
            dist/github-snake.svg?color_snake=00D4FF&color_dots=#0d1117,#003d5c,#006d8f,#00D4FF,#64FFDA
            dist/github-snake-dark.svg?palette=github-dark&color_snake=00D4FF&color_dots=#0d1117,#003d5c,#006d8f,#00D4FF,#64FFDA
      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
